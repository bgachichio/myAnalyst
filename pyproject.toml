[project]
name = "myanalyst"
version = "0.1.0"
description = "NSE equity valuation kernel and end-of-day price collector"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "httpx>=0.27", "openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Named explicitly. Flat-layout auto-discovery fails the moment a new top-level
# directory appears, and it fails at install time, not at review time.
[tool.setuptools]
packages = ["kernel", "collector"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
myanalyst-collect = "collector.run:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
