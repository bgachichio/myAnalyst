[project]
name = "myanalyst"
version = "0.1.0"
description = "NSE equity valuation kernel and end-of-day price collector"
requires-python = ">=3.11"
# Pinned, not floored. This is a deployed application, not a library: a floor
# means the VM can install a version nobody tested, and developer.md G3 treats
# an unpinned dependency as an auto-fail.
dependencies = ["httpx==0.28.1", "openpyxl==3.1.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Named explicitly. Flat-layout auto-discovery fails the moment a new top-level
# directory appears, and it fails at install time, not at review time.
[tool.setuptools]
packages = ["kernel", "collector"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
myanalyst-collect = "collector.run:main"
myanalyst-diagnose = "collector.diagnose:main"
myanalyst-probe = "collector.probe:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
