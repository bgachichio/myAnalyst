name: gate
on: [push, pull_request]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.21.2"

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Python kernel, store and adapters
        run: python -m pytest -q

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with: { node-version: "22" }
      - run: npm ci || npm install
      - name: TypeScript kernel against the same fixtures
        run: npm test

      # A gate that never builds the app it ships proves nothing about the app.
      - name: PWA type-check and production build
        run: npm run build

      # The gitleaks action scans the commit range of the push event. On the
      # first commit that range starts at a parent which does not exist: git
      # fails, nothing is scanned, and it still reports "no leaks found". A scan
      # that scans nothing and passes is worse than no scan, so this runs the
      # binary directly over the whole history and the whole tree, and proves it
      # actually looked at something.
      - name: Secret scan, whole git history
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks

          commits=$(git rev-list --count HEAD)
          echo "history carries $commits commits"
          test "$commits" -gt 0

          # Prove the scanner is detecting before trusting it to report clean.
          # A scanner that has silently stopped matching returns exit 0 on
          # everything, which is indistinguishable from a clean repository.
          # The token is generated here and never committed, because committing
          # it would fail the scan above - which is the point.
          canary="$(mktemp -d)"
          python3 -c "import random,string;print('ghp_'+''.join(random.choices(string.ascii_letters+string.digits,k=36)))" \
            > "$canary/token.txt"
          if ./gitleaks dir "$canary" --no-banner --redact --exit-code 1 >/dev/null 2>&1; then
            echo "!! the secret scanner did not flag a planted token; it is not detecting" >&2
            rm -rf "$canary"; exit 1
          fi
          rm -rf "$canary"
          echo "scanner confirmed detecting"

          # History, not the working tree: every committed file is in here, and
          # the tree in CI also holds node_modules. Findings reviewed and
          # dismissed live in .gitleaksignore, one pinned fingerprint each.
          ./gitleaks git . --redact --no-banner --exit-code 1

      # Audits the dependencies this project declares, read straight from
      # pyproject so the two cannot drift. Auditing the environment instead
      # trips over the editable install and over system packages that are not
      # on PyPI, which is a red build that means nothing.
      - name: Dependency audit
        run: |
          set -euo pipefail
          pip install pip-audit==2.7.3
          python - <<'PY' > audit-requirements.txt
          import tomllib, pathlib
          for line in tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]:
              print(line)
          PY
          cat audit-requirements.txt
          pip-audit --progress-spinner off --strict -r audit-requirements.txt
