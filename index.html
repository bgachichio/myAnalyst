<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#237352" />
    <meta name="description" content="NSE equity valuation, on the model that produced the 2016 UNGA and Liberty verdicts." />
    <title>myAnalyst</title>

    <!-- Declaring an icon also stops the browser's implicit /favicon.ico
         request, which 404s on every load without one. -->
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- design.md §12.1. Runs before any stylesheet so the wrong theme never
         paints. A file, not an inline script: the site is served under
         script-src 'self' with no unsafe-inline, which refuses inline code. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
